// ============================ 轻量中文分词 + 检索 ============================
const STOPWORDS = new Set("的 了 在 是 和 与 或 及 对 于 中 为 之 等 这 那 哪 什么 多少 怎么 如何 可以 能 吗 呢 啊 吧 请 问 有 没有 需要 应该 要 到 个 条 元 天 月 年 次 人".split(" "));

function tokenize(text){
  if(!text) return new Set();
  text = String(text);
  const tokens = new Set();
  const latin = text.toLowerCase().match(/[a-z0-9]+/g) || [];
  latin.forEach(t=>tokens.add(t));
  const cjk = text.match(/[一-鿿]/g) || [];
  cjk.forEach(c=>tokens.add(c));
  for(let i=0;i<cjk.length-1;i++){ tokens.add(cjk[i]+cjk[i+1]); }
  return new Set([...tokens].filter(t=>!STOPWORDS.has(t)));
}
function hay(policy){
  return tokenize((policy.title||"")+" "+(policy.content||"")+" "+ (policy.keywords||[]).join(" "));
}
function scorePolicy(qTokens, policy){
  const h = hay(policy);
  const kw = tokenize((policy.keywords||[]).join(" "));
  let score=0;
  qTokens.forEach(t=>{ if(h.has(t)) score += kw.has(t) ? 3 : (t.length>=2 ? 2 : 1); });
  return score;
}
function retrieve(query, policies, top_k=6){
  const qTokens = tokenize(query);
  if(qTokens.size===0) return [];
  const qBig = new Set([...qTokens].filter(t=>t.length>=2));
  const scored=[];
  policies.forEach(p=>{
    const anchor = tokenize((p.keywords||[]).join(" ")+" "+(p.category||""));
    let hit=false;
    for(const b of qBig){ if(anchor.has(b)){ hit=true; break; } }
    if(!hit) return;
    scored.push([scorePolicy(qTokens,p), p.id||"", p]);
  });
  scored.sort((a,b)=> (b[0]-a[0]) || (a[1]<b[1]?-1:1));
  return scored.slice(0,top_k).map(x=>x[2]);
}
function findConflict(policies){
  const ids = new Set(policies.map(p=>p.id));
  for(const p of policies){
    for(const other of (p.conflict_with||[])){
      if(ids.has(other)) return [p.id, other].sort();
    }
  }
  return null;
}
function topTier(hits, query){
  if(!hits.length) return [];
  const qTokens = tokenize(query);
  const scored = hits.map(p=>[scorePolicy(qTokens,p), p]);
  const smax = Math.max(...scored.map(s=>s[0]));
  return scored.filter(s=>s[0] >= smax-1).map(s=>s[1]);
}

// ============================ 转人工本地记录（localStorage） ============================
const LS_KEY = "reimb_escalations";
function loadRecords(){ try { return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); } catch(e){ return []; } }
function recordEscalation(query, reason, hits){
  const id = new Date().toISOString().slice(0,19).replace(/[-:T]/g,"") + "-" + Math.random().toString(16).slice(2,8);
  const entry = { id, ts:new Date().toISOString(), query, reason, matched:(hits||[]).map(p=>p.id) };
  const list = loadRecords(); list.push(entry);
  localStorage.setItem(LS_KEY, JSON.stringify(list));
  return id;
}

// ============================ 应答：规则引擎（默认离线可跑） ============================
function demoAnswer(query, hits){
  if(!hits.length)
    return {status:"escalate", answer:"", citations:[], reason:"未检索到与问题相关的政策，需人工确认适用范围。"};
  const tier = topTier(hits, query);
  const conflict = findConflict(tier);
  if(conflict)
    return {status:"escalate", answer:"", citations:[], reason:`检索到相互冲突的政策（${conflict.join(", ")}），同场景额度不一致，需人工审核确认适用标准。`};
  const blocks = tier.slice(0,3).map(p=>`《${p.title}》：${p.content}`);
  return {status:"answered", answer:blocks.join("；"), citations:tier.slice(0,3).map(p=>p.id), reason:"规则引擎命中"};
}

// ============================ 可选：大模型增强（浏览器直连，失败回退） ============================
const AI = (()=>{
  try { return JSON.parse(localStorage.getItem("reimb_ai")||"null") || {base:"",key:"",model:""}; }
  catch(e){ return {base:"",key:"",model:""}; }
})();
function aiValid(){ return !!(AI.base && AI.key && AI.model); }
const SYSTEM_PROMPT = `你是一名公司「报销政策智能助手」。你只能依据下方提供的【政策上下文】回答员工的问题。
规则：
1. 若问题能在政策上下文中找到明确依据，请用简洁中文回答，并在 citations 中列出引用的政策 id 列表。
2. 若出现以下任一情况，必须将 status 设为 "escalate"，在 reason 中说明原因：政策上下文无相关政策（政策不存在）；命中的多条政策相互冲突；政策依据不足无法给出确定答案。
3. 只返回 JSON 对象，格式严格为：{"status":"answered|escalate","answer":str,"citations":[str],"reason":str}`;

function parseJson(text){
  if(!text) return null;
  text = text.replace(/```(?:json)?\s*/g,"").replace(/\s*```/g,"").trim();
  const s=text.indexOf("{"); const e=text.lastIndexOf("}");
  if(s===-1||e===-1||e<s) return null;
  try { return JSON.parse(text.slice(s,e+1)); } catch(_){ return null; }
}
async function callLLM(query, hits){
  if(!aiValid()) return null;
  const ctx = hits.length ? hits.map(p=>`[${p.id}] ${p.title}（类别：${p.category}，生效：${p.effective_date}）\n${p.content}`).join("\n\n") : "（无相关政策）";
  try{
    const resp = await fetch(AI.base.replace(/\/$/,"")+"/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+AI.key},
      body: JSON.stringify({model:AI.model, temperature:0,
        messages:[{role:"system",content:SYSTEM_PROMPT+"\n\n===== 政策上下文 =====\n"+ctx},
                  {role:"user",content:query}]})
    });
    if(!resp.ok) return null;
    const data = await resp.json();
    return data?.choices?.[0]?.message?.content || null;
  }catch(_){ return null; }
}

// ============================ 主流程 ============================
async function answerQuestion(query){
  const hits = retrieve(query, POLICIES, 6);
  let result = null;
  if(aiValid()){
    const text = await callLLM(query, hits);
    if(text){
      const data = parseJson(text);
      if(data && (data.status==="answered"||data.status==="escalate")){
        let cit = data.citations||[];
        if(data.status==="answered"){
          const hitIds = new Set(hits.map(h=>h.id));
          cit = cit.filter(c=>hitIds.has(c));
        }
        result = {status:data.status, answer:data.answer||"", citations:cit, reason:data.reason||""};
      }
    }
  }
  if(!result) result = demoAnswer(query, hits);
  if(result.status==="escalate" && !result.escalation_id)
    result.escalation_id = recordEscalation(query, result.reason, hits);
  return result;
}

// ============================ UI ============================
const chat=document.getElementById('chat'), q=document.getElementById('q'), send=document.getElementById('send');
function scroll(){ chat.scrollTop=chat.scrollHeight; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function addUser(text){ const d=document.createElement('div'); d.className='msg user'; d.textContent=text; chat.appendChild(d); scroll(); }
function addBot(data){
  if(data.status==='escalate'){
    const c=document.createElement('div'); c.className='esc-card';
    c.innerHTML='<span class="tag">已转人工审核</span><div class="reason">'+escapeHtml(data.reason||'该问题需人工进一步核实。')+'</div>'+
      (data.escalation_id?'<div class="eid">工单编号：'+escapeHtml(data.escalation_id)+'</div>':'');
    chat.appendChild(c);
  } else {
    const d=document.createElement('div'); d.className='msg bot'; d.textContent=data.answer||'';
    if(data.citations&&data.citations.length){
      const c=document.createElement('div'); c.className='cites';
      c.innerHTML='政策来源：'+data.citations.map(id=>'<span>'+escapeHtml(id)+'</span>').join('');
      d.appendChild(c);
    }
    chat.appendChild(d);
  }
  scroll();
}
function typing(){ const t=document.createElement('div'); t.className='typing'; t.textContent='助手正在输入…'; chat.appendChild(t); scroll(); return t; }
async function ask(text){
  text=(text||'').trim(); if(!text) return;
  addUser(text); const t=typing(); send.disabled=true;
  try{
    const data = await answerQuestion(text); t.remove(); addBot(data);
  }catch(e){
    t.remove();
    const c=document.createElement('div'); c.className='esc-card';
    c.innerHTML='<span class="tag">已转人工审核</span><div class="reason">处理异常，已为您转人工：'+escapeHtml(e.message||'未知错误')+'</div>';
    chat.appendChild(c); scroll();
  }finally{ send.disabled=false; }
}
send.addEventListener('click',()=>{ ask(q.value); q.value=''; });
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ ask(q.value); q.value=''; } });
document.getElementById('chips').addEventListener('click',e=>{ if(e.target.dataset.q) ask(e.target.dataset.q); });

// 抽屉
const drawer=document.getElementById('drawer'), recBody=document.getElementById('recBody');
document.getElementById('btnRecords').addEventListener('click',()=>{
  const list=loadRecords();
  if(!list.length){ recBody.innerHTML='<div class="empty">暂无转人工记录</div>'; }
  else{
    recBody.innerHTML = list.slice().reverse().map(r=>
      `<div class="rec"><div class="id">工单 ${escapeHtml(r.id)}</div>`+
      `<div class="meta">${escapeHtml(r.ts||'')}</div>`+
      `<div class="q">问：${escapeHtml(r.query||'')}</div>`+
      `<div class="r">原因：${escapeHtml(r.reason||'')}</div>`+
      (r.matched&&r.matched.length?`<div class="meta">疑似命中：${escapeHtml(r.matched.join(", "))}</div>`:'')+
      `</div>`).join('');
  }
  drawer.classList.add('open');
});
document.getElementById('drawerClose').addEventListener('click',()=>drawer.classList.remove('open'));

// 设置
const settings=document.getElementById('settings');
document.getElementById('btnSettings').addEventListener('click',()=>{
  document.getElementById('setBase').value=AI.base||'';
  document.getElementById('setKey').value=AI.key||'';
  document.getElementById('setModel').value=AI.model||'';
  settings.classList.add('open');
});
document.getElementById('setCancel').addEventListener('click',()=>settings.classList.remove('open'));
document.getElementById('setSave').addEventListener('click',()=>{
  AI.base=document.getElementById('setBase').value.trim();
  AI.key=document.getElementById('setKey').value.trim();
  AI.model=document.getElementById('setModel').value.trim();
  localStorage.setItem("reimb_ai", JSON.stringify(AI));
  settings.classList.remove('open');
  const tip=document.createElement('div'); tip.className='msg bot';
  tip.textContent = aiValid() ? '✅ 已启用大模型增强（'+(AI.model)+'）。' : '已保存，当前为空，将使用本地规则引擎离线作答。';
  chat.appendChild(tip); scroll();
});
</script>
</body>
</html>
